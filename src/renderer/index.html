<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Momus Notch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&family=Space+Grotesk:wght@500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Container with zero outer shadow -->
  <div id="notch-container" class="notch-container mode-expanded">
    
    <!-- Ambient Backlight Glow (Dynamic Island Theme) -->
    <div class="ambient-glow" id="ambient-glow"></div>

    <!-- 1. COMPACT PILL VIEW -->
    <div id="pill-view" class="pill-view">
      <!-- Left side: Status dot + Privacy dots + Brand text -->
      <div class="pill-left">
        <div class="pill-status-slot" id="pill-status-slot">
          <div class="pill-green-dot" id="pill-green-dot"></div>
          <div class="pill-spotify-icon" id="pill-spotify-icon" style="display:none;">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="#1db954"><path d="M12 2C6.477 2 2 6.477 2 12c0 5.524 4.477 10 10 10 5.522 0 10-4.476 10-10 0-5.523-4.478-10-10-10zm4.586 14.424c-.18.295-.563.387-.857.208-2.35-1.434-5.308-1.758-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.51 9.721 1.11.294.18.388.563.208.859zm1.224-2.724c-.226.367-.71.482-1.077.257-2.69-1.653-6.79-2.131-9.97-1.165-.413.125-.85-.11-.975-.523-.125-.413.11-.85.523-.975 3.633-1.103 8.147-.568 11.242 1.33.367.225.482.71.257 1.076zm.105-2.835C14.692 8.94 9.37 8.762 6.297 9.695c-.495.15-1.02-.133-1.17-.628-.15-.496.133-1.02.628-1.17 3.532-1.072 9.404-.866 13.115 1.338.445.264.59.838.327 1.282-.264.444-.838.59-1.282.327z"/></svg>
          </div>
          <div class="pill-youtube-icon" id="pill-youtube-icon" style="display:none;">
            <svg width="13" height="10" viewBox="0 0 24 17">
              <path d="M23.5 6.2c-.3-1.1-1.1-1.9-2.2-2.2C19.3 3.5 12 3.5 12 3.5s-7.3 0-9.3.5c-1.1.3-1.9 1.1-2.2 2.2C0 8.2 0 12 0 12s0 3.8.5 5.8c.3 1.1 1.1 1.9 2.2 2.2 2 .5 9.3.5 9.3.5s7.3 0 9.3-.5c1.1-.3 1.9-1.1 2.2-2.2.5-2 .5-5.8.5-5.8s0-3.8-.5-5.8z" fill="#ff0000"/>
              <polygon points="9.6 8.5 9.6 15.5 15.8 12" fill="#ffffff"/>
            </svg>
          </div>
        </div>
        <div class="privacy-dots-wrap">
          <span class="privacy-dot mic-dot" id="pill-mic-dot" style="display:none;"></span>
          <span class="privacy-dot cam-dot" id="pill-cam-dot" style="display:none;"></span>
        </div>
        <div class="pill-text-wrap" id="pill-text-wrap">
          <span class="pill-brand-text" id="pill-brand-text">momus</span>
        </div>
      </div>

      <!-- Right side: Mini sound bars (only when playing) OR weather temp / DND moon -->
      <div class="pill-right">
        <span class="pill-dnd-icon" id="pill-dnd-icon" style="display:none;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="#a855f7"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
        <div class="pill-audio-mini" id="pill-audio-mini" style="display:none;">
          <span class="pbar"></span>
          <span class="pbar"></span>
          <span class="pbar"></span>
        </div>
        <div class="pill-weather-mini" id="pill-weather-mini">
          <span class="pill-weather-val" id="pill-weather-val">--°</span>
        </div>
      </div>

      <!-- Pill Music Neon Progress Line (Bottom edge of notch) -->
      <div class="pill-progress-track" id="pill-progress-track" style="display:none;">
        <div class="pill-progress-fill" id="pill-progress-fill"></div>
      </div>

      <!-- Pill HUD Overlay (Caps Lock / Volume / Charging / Message Toast shown directly in pill mode) -->
      <div class="pill-hud-overlay" id="pill-hud-overlay" style="display:none;">
        <span class="pill-hud-icon" id="pill-hud-icon"></span>
        <div class="pill-hud-body" id="pill-hud-body">
          <span class="pill-hud-title" id="pill-hud-title">Caps Lock</span>
          <span class="pill-hud-sub" id="pill-hud-sub" style="display:none;"></span>
        </div>
      </div>
    </div>

    <!-- 2. EXPANDED NOTCH VIEW -->
    <div id="expanded-view" class="expanded-view">
      <!-- Top Drag Bar -->
      <div class="drag-handle"></div>

      <!-- Main Header Row: Brand Info (Left) + System Actions / Media (Right) -->
      <div class="header-row">
        <!-- Logo / Album Art + Text -->
        <div class="brand-group">
          <div class="logo-box" id="logo-box">
            <img src="../../assets/icon.png" alt="momus" class="logo-img" id="logo-img">
          </div>
          <div class="text-group">
            <span class="title-text" id="title-text">momus</span>
            <div class="status-indicator">
              <span class="live-dot" id="live-dot"></span>
              <span class="live-spotify-dot" id="live-spotify-dot" style="display:none;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="#1db954"><path d="M12 2C6.477 2 2 6.477 2 12c0 5.524 4.477 10 10 10 5.522 0 10-4.476 10-10 0-5.523-4.478-10-10-10zm4.586 14.424c-.18.295-.563.387-.857.208-2.35-1.434-5.308-1.758-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.51 9.721 1.11.294.18.388.563.208.859zm1.224-2.724c-.226.367-.71.482-1.077.257-2.69-1.653-6.79-2.131-9.97-1.165-.413.125-.85-.11-.975-.523-.125-.413.11-.85.523-.975 3.633-1.103 8.147-.568 11.242 1.33.367.225.482.71.257 1.076zm.105-2.835C14.692 8.94 9.37 8.762 6.297 9.695c-.495.15-1.02-.133-1.17-.628-.15-.496.133-1.02.628-1.17 3.532-1.072 9.404-.866 13.115 1.338.445.264.59.838.327 1.282-.264.444-.838.59-1.282.327z"/></svg>
              </span>
              <span class="live-youtube-dot" id="live-youtube-dot" style="display:none;">
                <svg width="13" height="10" viewBox="0 0 24 17">
                  <path d="M23.5 6.2c-.3-1.1-1.1-1.9-2.2-2.2C19.3 3.5 12 3.5 12 3.5s-7.3 0-9.3.5c-1.1.3-1.9 1.1-2.2 2.2C0 8.2 0 12 0 12s0 3.8.5 5.8c.3 1.1 1.1 1.9 2.2 2.2 2 .5 9.3.5 9.3.5s7.3 0 9.3-.5c1.1-.3 1.9-1.1 2.2-2.2.5-2 .5-5.8.5-5.8s0-3.8-.5-5.8z" fill="#ff0000"/>
                  <polygon points="9.6 8.5 9.6 15.5 15.8 12" fill="#ffffff"/>
                </svg>
              </span>
              <span class="status-label" id="status-label">Sistem Aktif</span>
              <!-- Privacy indicators in expanded view -->
              <span class="privacy-dot mic-dot" id="exp-mic-dot" style="display:none;"></span>
              <span class="privacy-dot cam-dot" id="exp-cam-dot" style="display:none;"></span>
            </div>
          </div>
        </div>

        <!-- Center Audio Wave / Visualizer (Only visible when music is playing) -->
        <div class="visualizer" id="visualizer" style="display:none;">
          <span class="vbar"></span>
          <span class="vbar"></span>
          <span class="vbar"></span>
          <span class="vbar"></span>
          <span class="vbar"></span>
        </div>

        <!-- Media Player Controls (Only visible when music is playing) -->
        <div class="media-controls-group" id="media-controls-group" style="display:none;">
          <button class="media-btn" id="btn-prev">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2.5"/></svg>
          </button>
          <button class="media-btn play-btn" id="btn-playpause">
            <svg id="svg-play" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="media-btn" id="btn-next">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2.5"/></svg>
          </button>
        </div>

        <!-- System Controls (Mute + Focus Mode + Settings) -->
        <div class="actions-group">
          <!-- Apple Focus Mode Toggle (DND) -->
          <button class="action-btn" id="btn-focus">
            <svg id="svg-focus-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>

          <button class="action-btn" id="btn-mute">
            <svg id="svg-vol" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            <svg id="svg-mute" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
          </button>
          
          <button class="action-btn" id="btn-settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
      </div>

      <!-- Quick Apps Dock Row (Shown below header row, completely spacious) -->
      <div class="dock-apps-row" id="dock-apps-row">
        <button class="app-btn" id="app-spotify">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 5.524 4.477 10 10 10 5.522 0 10-4.476 10-10 0-5.523-4.478-10-10-10zm4.586 14.424c-.18.295-.563.387-.857.208-2.35-1.434-5.308-1.758-8.793-.963-.335.077-.67-.133-.746-.468-.077-.334.132-.67.467-.746 3.808-.87 7.076-.51 9.721 1.11.294.18.388.563.208.859zm1.224-2.724c-.226.367-.71.482-1.077.257-2.69-1.653-6.79-2.131-9.97-1.165-.413.125-.85-.11-.975-.523-.125-.413.11-.85.523-.975 3.633-1.103 8.147-.568 11.242 1.33.367.225.482.71.257 1.076zm.105-2.835C14.692 8.94 9.37 8.762 6.297 9.695c-.495.15-1.02-.133-1.17-.628-.15-.496.133-1.02.628-1.17 3.532-1.072 9.404-.866 13.115 1.338.445.264.59.838.327 1.282-.264.444-.838.59-1.282.327z"/></svg>
        </button>
        <button class="app-btn" id="app-discord">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.04.035.05a19.906 19.906 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
        </button>
        <button class="app-btn" id="app-browser">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </button>
        <button class="app-btn" id="app-explorer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        </button>
        <button class="app-btn" id="app-airdrop-shelf">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="app-btn" id="app-notes">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        </button>
      </div>

      <!-- Volume Slider Section -->
      <div class="slider-row">
        <div class="slider-track-wrap">
          <input type="range" id="vol-slider" min="0" max="100" value="50">
        </div>
        <span class="vol-percentage" id="vol-text">50%</span>
      </div>

      <!-- Footer Action Row -->
      <div class="footer-row">
        <div class="footer-left-info">
          <span class="clock-badge" id="clock-badge">16:55</span>
          
          <!-- Live Weather Pill -->
          <div class="weather-badge" id="weather-badge" title="Hava Durumu">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#facc15" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <span id="weather-text">--°C</span>
          </div>

          <!-- Battery Badge -->
          <div class="batt-badge" id="batt-badge" title="Pil Durumu">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="16" height="10" rx="2"/><line x1="20" y1="11" x2="20" y2="13"/><line x1="6" y1="11" x2="6" y2="13"/></svg>
            <span id="batt-val">100%</span>
          </div>

          <span class="spotify-tag-badge" id="spotify-tag-badge" style="display:none;">Spotify</span>
        </div>

        <button class="collapse-pill-btn" id="btn-collapse" title="Pile Donustur (Esc)">
          <span>Gizle</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"/></svg>
        </button>
      </div>

      <!-- AirDrop Drop Target Overlay -->
      <div class="airdrop-dropzone" id="airdrop-dropzone">
        <div class="airdrop-drop-card">
          <div class="airdrop-radar-ring">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v8"/><path d="m8 12 4 4 4-4"/></svg>
          </div>
          <span class="airdrop-text">AirDrop Yuvasına Bırak</span>
          <span class="airdrop-sub">Yuvaya yerleşecek & istediğin zaman al</span>
        </div>
      </div>

      <!-- MagSafe Charging Pop-up Overlay (iOS/macOS style) -->
      <div class="magsafe-popup" id="magsafe-popup">
        <div class="magsafe-ring">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div class="magsafe-info">
          <span class="magsafe-title">Şarj Ediliyor</span>
          <span class="magsafe-val" id="magsafe-percent">100%</span>
        </div>
      </div>

      <!-- Caps Lock / System HUD Popup Overlay -->
      <div class="system-hud-popup" id="system-hud-popup">
        <span class="hud-icon" id="hud-icon"></span>
        <span class="hud-text" id="hud-text">Caps Lock Açık</span>
      </div>

      <!-- Interactive Notification Toast Balloon (Sliding in when notification arrives) -->
      <div class="toast-balloon" id="toast-balloon">
        <div class="toast-dot"></div>
        <div class="toast-content">
          <span class="toast-title" id="toast-title">Momus Bildirim</span>
          <span class="toast-desc" id="toast-desc">İçerik</span>
        </div>
      </div>
    </div>

    <!-- 3. SPOTLIGHT SEARCH VIEW -->
    <div id="spotlight-view" class="spotlight-view">
      <div class="spotlight-bar">
        <span class="spotlight-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" id="spotlight-input" class="spotlight-input" placeholder="Bir şey ara, hesapla (ör: 48*12) veya web'de aç..." autocomplete="off" spellcheck="false">
        <div class="spotlight-calc-badge" id="spotlight-calc-badge" style="display:none;">
          <span class="calc-label">=</span>
          <span class="calc-val" id="spotlight-calc-val"></span>
        </div>
        <button class="spotlight-close-btn" id="spotlight-close-btn" title="Kapat (Esc)">✕</button>
      </div>
    </div>

    <!-- 4. AIRDROP INTERACTIVE SLOTS SHELF VIEW -->
    <div id="airdrop-shelf-view" class="airdrop-shelf-view">
      <div class="airdrop-shelf-header">
        <div class="shelf-header-left">
          <span class="shelf-pulse-dot"></span>
          <span class="shelf-title">AirDrop Dosya Yuvaları</span>
          <span class="shelf-hint">(Bırak & Çöp Kutusundan Sil)</span>
        </div>
        <button class="shelf-close-btn" id="shelf-close-btn" title="Kapat (Esc)">✕</button>
      </div>

      <!-- 4 Interactive Slots Grid -->
      <div class="airdrop-slots-grid" id="airdrop-slots-grid">
        <!-- 4 Slot kutusu dinamik yüklenecek -->
      </div>
    </div>

    <!-- 5. QUICK NOTE INTERACTIVE VIEW -->
    <div id="notes-view" class="notes-view">
      <div class="notes-header">
        <div class="notes-header-left">
          <span class="notes-dot"></span>
          <span class="notes-title">Hızlı Not</span>
          <span class="notes-hint">(Otomatik Kaydedilir)</span>
        </div>
        <button class="notes-close-btn" id="notes-close-btn">✕</button>
      </div>
      <textarea id="notes-textarea" class="notes-textarea" placeholder="Buraya hızlıca bir şeyler karala..."></textarea>
    </div>

    <!-- Hidden Canvas for Dynamic Spotify Color Extraction -->
    <canvas id="color-extractor-canvas" width="64" height="64" style="display:none;"></canvas>

  </div>

  <script src="app.js"></script>
</body>
</html>
